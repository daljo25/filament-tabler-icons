name: Release Plugin

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: contains(github.event.head_commit.message, 'update Tabler icons')
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract version from commit
        id: version
        run: |
          VERSION=$(git log -1 --pretty=%B | grep -oE '[0-9]+\.[0-9]+\.[0-9]+')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Git tag
        run: |
          git tag v${{ steps.version.outputs.version }}
          git push origin v${{ steps.version.outputs.version }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          body: |
            Updated the bundled icon library to **Tabler Icons v${{ steps.version.outputs.version }}**.

            To see what's new in this version, check the official release:
            https://github.com/tabler/tabler-icons/releases/tag/v${{ steps.version.outputs.version }}
