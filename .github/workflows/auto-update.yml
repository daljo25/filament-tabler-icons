name: Auto Update Tabler Icons

on:
  schedule:
    # Diario 06:00 UTC: el paquete padre puede publicar cualquier día
    # (v3.48.0 salió un martes y el cron semanal de los lunes lo missed
    #  por hasta 6 días). Con frecuencia diaria el lag máximo es ~24h.
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-icons:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.MY_GITHUB_TOKEN }}

      # FIX NODE VERSION (evita warnings de Node 20)
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: 8.3
          tools: composer

      # Sincronizar con remoto ANTES de generar cambios.
      # (Antes estaba después de regenerar el enum y el
      #  `git reset --hard` borraba los cambios recién generados,
      #  por lo que nunca se detectaba nada que commitear.)
      - name: Sync with remote
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git fetch origin main
          git reset --hard origin/main

      - name: Install dependencies
        run: composer install --no-interaction --no-progress

      - name: Update blade-tabler-icons
        run: composer update secondnetwork/blade-tabler-icons --no-interaction

      - name: Get installed Tabler version
        id: tabler
        run: |
          # --format=json + jq es robusto frente a cambios de formato/locale
          # del output texto de `composer show` (el grep 'versions' | awk
          # anterior devolvía vacío si el formato cambiaba y el commit
          # salía como "v" sin número, rompiendo el gate del release.yml).
          VERSION=$(composer show secondnetwork/blade-tabler-icons --format=json | jq -r '.versions[0] | ltrimstr("v")')
          if [ -z "$VERSION" ] || [ "$VERSION" = "null" ]; then
            echo "Could not determine installed version"
            exit 1
          fi
          echo "Installed: $VERSION"
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Get latest upstream version
        id: upstream
        run: |
          # Referencia independiente de Packagist para log/diagnóstico:
          # si composer no trae lo último (caché, constraint ^x.y), aquí se ve.
          LATEST=$(curl -s https://repo.packagist.org/p2/secondnetwork/blade-tabler-icons.json | jq -r '.packages["secondnetwork/blade-tabler-icons"][0].version | ltrimstr("v")')
          echo "Upstream latest: $LATEST"
          echo "version=$LATEST" >> $GITHUB_OUTPUT

      - name: Regenerate enums
        run: php update-tabler-enum.php

      - name: Check for changes
        id: changes
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "changed=false" >> $GITHUB_OUTPUT
          else
            echo "changed=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit and Push
        if: steps.changes.outputs.changed == 'true'
        run: |
          git commit -m "chore: update Tabler icons to v${{ steps.tabler.outputs.version }}"
          git push origin main